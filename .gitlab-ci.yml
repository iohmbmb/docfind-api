stages:
  - test

cache:
  key:
    files:
      - "**/*.csproj"
  paths:
    - .nuget/packages/

.test_template: &test_definition
  stage: test
  image: ://microsoft.com 
  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  before_script:
    - dotnet restore
  script:
    - echo "Running .NET Test Suite..."
    - dotnet test --no-restore --logger:"junit;LogFilePath=$CI_PROJECT_DIR/junit/results.xml"
  artifacts:
    name: "backend-test-results-$CI_COMMIT_REF_SLUG"
    when: always
    paths:
      - junit/
    reports:
      junit: junit/results.xml

test:mr:
  <<: *test_definition
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:master:
  <<: *test_definition
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
